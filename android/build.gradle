// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    buildToolsVersion = findProperty('buildToolsVersion') ?: "35.0.0"
    minSdkVersion = findProperty('minSdkVersion')?.toInteger() ?: 24
    compileSdkVersion = findProperty('compileSdkVersion')?.toInteger() ?: 35
    targetSdkVersion = findProperty('targetSdkVersion')?.toInteger() ?: 35
    ndkVersion = findProperty('ndkVersion') ?: "27.1.12297006"
    kotlinVersion = findProperty('kotlinVersion') ?: "2.1.20"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle:8.13.2')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  configurations.all {
    resolutionStrategy {
      force 'androidx.core:core:1.15.0'
      force 'androidx.core:core-ktx:1.15.0'
      force 'androidx.browser:browser:1.8.0'
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
